# Stage D Phase 0 — Commit #7: Tier-1 Continuous Integration (C6 §8).
# Reuses the existing npm scripts (C1 §8 local↔CI parity); adds no npm deps.
# These status checks are what GitHub branch protection will later require (C4 §10).
name: CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  verify:
    name: Verify (install · type · test · build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, lockfile-verified)
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Stage D Phase 1 — Tier-2 architecture guards (C6 §8 / C3 §12). Required from Migration #1.
  db-guards:
    name: DB guards (RLS · tenant · audit · drift · no-role-name · no-float)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, lockfile-verified)
        run: npm ci

      - name: Ensure psql client
        run: psql --version || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      - name: Static guards (no-role-name-auth, no-float-money)
        run: npm run guard:static

      - name: Start local Supabase
        run: npx supabase start

      - name: Apply migrations (deterministic reset)
        run: npm run db:reset

      - name: Customers security tests (tenant isolation · customer.manage/read gates · non-money attribution · AR standing)
        run: bash scripts/ci/guard-retry.sh guard:customers
        env:
          GUARD_RESTART_ON_FLAKE: '1'

      - name: DB guards (rls-enabled, tenant-ownership, audit-immutability)
        run: bash scripts/ci/guard-retry.sh guard:db

      - name: Behavioral security tests (cross-tenant · permission · lifecycle · audit-immutability)
        run: bash scripts/ci/guard-retry.sh guard:rls

      - name: Bootstrap security tests (one-time · authorized · atomic · audited)
        run: bash scripts/ci/guard-retry.sh guard:bootstrap

      - name: Organization security tests (authenticated writes · invitations · membership · isolation)
        run: bash scripts/ci/guard-retry.sh guard:org

      - name: Crop security tests (company · branch isolation · permission · archived-usage · audit)
        run: bash scripts/ci/guard-retry.sh guard:crop

      - name: Inventory security tests (ledger-derived · tamper-proof · append-only · opening · isolation)
        run: bash scripts/ci/guard-retry.sh guard:inventory

      - name: POS sale security tests (balanced posting · stock decrement · idempotency · no-oversell · price-authority)
        run: bash scripts/ci/guard-retry.sh guard:pos

      - name: Accounting security tests (balanced cash postings · void-not-delete · GL-reconciled statements)
        run: bash scripts/ci/guard-retry.sh guard:accounting

      - name: Payroll security tests (balanced wage/advance postings · wage authority · derived balance · statements tie)
        run: bash scripts/ci/guard-retry.sh guard:payroll

      - name: Scheduling security tests (tenant · branch isolation · permission gating · audit)
        run: bash scripts/ci/guard-retry.sh guard:scheduling

      - name: Projects security tests (tenant · branch isolation · task parent-scoping · permission gating · audit)
        run: bash scripts/ci/guard-retry.sh guard:projects

      - name: Auth lifecycle security tests (P1A self-signup trigger · P1B requested-role queue · account recovery)
        run: bash scripts/ci/guard-retry.sh guard:auth

      - name: Schema-drift guard
        run: npm run guard:drift

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop
